name: CI – Demo Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full demo pipeline
        run: python run_all.py

      - name: Verify output files exist
        run: |
          set -e
          ls results/
          test -f results/golden_ratio_leaderboard.png
          test -f results/golden_ratio_report.txt
          test -f results/sisyphus_diagram.png
          ls results/*si_q* | head -1
          echo "All expected outputs present."

      - name: Run simulator headless (--no-show)
        run: python u_core_simulator_v25_2.py --no-show

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          path: results/
          retention-days: 7
